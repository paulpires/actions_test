name: PR size labeller (Custom)

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  labeler:
    runs-on: ubuntu-latest
    name: Label the PR size
    steps:
      - name: Get PR diff stats
        id: pr-stats
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const totalChanges = pr.additions + pr.deletions;
            
            core.setOutput('additions', pr.additions);
            core.setOutput('deletions', pr.deletions);
            core.setOutput('total_changes', totalChanges);
            core.setOutput('files_changed', pr.changed_files);

      - name: Determine PR size and label
        id: size-label
        run: |
          TOTAL_CHANGES=${{ steps.pr-stats.outputs.total_changes }}
          
          # Size thresholds
          XS_MAX=75
          S_MAX=150
          M_MAX=300
          L_MAX=600
          
          # Determine size and label
          if [ $TOTAL_CHANGES -le $XS_MAX ]; then
            echo "size=XS" >> $GITHUB_OUTPUT
            echo "label=XS🌟" >> $GITHUB_OUTPUT
          elif [ $TOTAL_CHANGES -le $S_MAX ]; then
            echo "size=S" >> $GITHUB_OUTPUT
            echo "label=S🏆" >> $GITHUB_OUTPUT
          elif [ $TOTAL_CHANGES -le $M_MAX ]; then
            echo "size=M" >> $GITHUB_OUTPUT
            echo "label=M🙌" >> $GITHUB_OUTPUT
          elif [ $TOTAL_CHANGES -le $L_MAX ]; then
            echo "size=L" >> $GITHUB_OUTPUT
            echo "label=L🥈" >> $GITHUB_OUTPUT
          else
            echo "size=XL" >> $GITHUB_OUTPUT
            echo "label=XL🚫" >> $GITHUB_OUTPUT
          fi
          
          echo "Determined size: $(cat $GITHUB_OUTPUT | grep size= | cut -d= -f2) ($TOTAL_CHANGES total changes)"

      - name: Remove existing size labels
        uses: actions/github-script@v7
        with:
          script: |
            const sizeLabels = ['XS🌟', 'S🏆', 'M🙌', 'L🥈', 'XL🚫'];
            
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            for (const label of labels) {
              if (sizeLabels.includes(label.name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label.name
                });
                console.log(`Removed label: ${label.name}`);
              }
            }

      - name: Add size label
        uses: actions/github-script@v7
        with:
          script: |
            const label = '${{ steps.size-label.outputs.label }}';
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });
            
            console.log(`Added label: ${label}`);

      - name: Handle XL PR
        if: steps.size-label.outputs.size == 'XL'
        uses: actions/github-script@v7
        with:
          script: |
            const message = 'This PR is pretty big 😱! If possible, please break it up in smaller chunks!';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
            
            console.log('Added XL warning comment');

      - name: Summary
        run: |
          echo "## PR Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: ${{ steps.size-label.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Label**: ${{ steps.size-label.outputs.label }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Changes**: ${{ steps.pr-stats.outputs.total_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Additions**: ${{ steps.pr-stats.outputs.additions }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deletions**: ${{ steps.pr-stats.outputs.deletions }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Files Changed**: ${{ steps.pr-stats.outputs.files_changed }}" >> $GITHUB_STEP_SUMMARY